<title>Estação Semiologia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sala de estação OSCE — trilho lateral de navegação + prancheta central; traçado de ECG como assinatura */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --surface-2: #E3ECE9;
  --surface-3: #D5E2DE;
  --ink: #12252A;
  --muted: #566C70;
  --line: #CBD9D5;
  --teal: #0B6A63;
  --teal-soft: #D4ECE8;
  --on-teal: #FFFFFF;
  --trace: #D23D6B;
  --trace-soft: #FBE3EB;
  --amber: #A86A0C;
  --amber-soft: #FCF0D9;
  --ok: #24804F;
  --ok-soft: #DDF2E5;
  --bad: #C2332E;
  --bad-soft: #FBE2E0;
  --grid: rgba(210, 61, 107, .07);
  --shadow: 0 1px 2px rgba(18, 37, 42, .06), 0 4px 16px rgba(18, 37, 42, .05);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --a1: #0B6A63; --a2: #6B4FA0; --a3: #1F6FB0; --a4: #C2335E; --a5: #9A6A12; --a6: #3E7D3A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1416; --surface: #122023; --surface-2: #19292D; --surface-3: #213439; --ink: #E2EDEA; --muted: #91A9AC; --line: #26393D;
    --teal: #45C1B4; --teal-soft: #15332F; --on-teal: #04211E; --trace: #F2709A; --trace-soft: #3A1B26; --amber: #E7AE4C; --amber-soft: #33270F;
    --ok: #5FCB8F; --ok-soft: #14301F; --bad: #F2766F; --bad-soft: #3A1A18; --grid: rgba(242, 112, 154, .06);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --a1: #45C1B4; --a2: #B49CE8; --a3: #6FB1EA; --a4: #F2709A; --a5: #E2B35C; --a6: #8ACB7E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1416; --surface: #122023; --surface-2: #19292D; --surface-3: #213439; --ink: #E2EDEA; --muted: #91A9AC; --line: #26393D;
  --teal: #45C1B4; --teal-soft: #15332F; --on-teal: #04211E; --trace: #F2709A; --trace-soft: #3A1B26; --amber: #E7AE4C; --amber-soft: #33270F;
  --ok: #5FCB8F; --ok-soft: #14301F; --bad: #F2766F; --bad-soft: #3A1A18; --grid: rgba(242, 112, 154, .06);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  --a1: #45C1B4; --a2: #B49CE8; --a3: #6FB1EA; --a4: #F2709A; --a5: #E2B35C; --a6: #8ACB7E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
a { color: var(--teal); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; margin-top: 1.1em; margin-bottom: .4em; }
p { margin: .5em 0; }
ul, ol { margin: .4em 0; padding-left: 1.3em; }
li { margin: .2em 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ------- shell */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line); padding: 18px 14px 24px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; flex-direction: column; gap: 6px; padding: 4px 8px 10px; text-decoration: none; color: var(--ink); }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 1.32rem; letter-spacing: -.02em; line-height: 1; }
.brand-name span { color: var(--trace); }
.brand svg { width: 100%; height: 26px; }
.ecg-path { fill: none; stroke: var(--trace); stroke-width: 2; stroke-linejoin: round; stroke-dasharray: 520; stroke-dashoffset: 520; animation: ecg 3.2s linear infinite; }
@keyframes ecg { 0% { stroke-dashoffset: 520; } 70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .ecg-path { animation: none; stroke-dashoffset: 0; } }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
.nav-link {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink);
  font-weight: 600; font-size: .95rem;
}
.nav-link:hover { background: var(--surface-2); }
.nav-link.active { background: var(--teal); color: var(--on-teal); }
.nav-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; background: var(--muted); }
.nav-link.active .nav-dot { background: var(--on-teal) !important; }
.nav-prog { margin-left: auto; font-family: var(--f-mono); font-size: .7rem; opacity: .8; }
.rail-foot { margin-top: auto; display: flex; gap: 8px; padding: 0 8px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px;
}
.topbar .menu-btn { display: none; }
.search { flex: 1; max-width: 520px; position: relative; }
.search input {
  width: 100%; padding: 9px 12px 9px 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: .95rem;
}
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); }
.top-actions { margin-left: auto; display: flex; gap: 6px; }
.content {
  width: 100%; max-width: 1040px; margin: 0 auto;
  padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 700px) { .content { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 959px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 80; left: 0; top: 0; bottom: 0; height: 100%; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow); padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .rail.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 70; }
  .topbar .menu-btn { display: inline-flex; }
}

/* ------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; font-size: .95rem; line-height: 1.2;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.small { padding: 6px 11px; font-size: .85rem; border-radius: 8px; }
.btn.icon { padding: 8px; width: 38px; height: 38px; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: .88rem; font-weight: 600; color: var(--ink);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-block; font-family: var(--f-mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }

/* ------- surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.page-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
.page-head p { max-width: 68ch; color: var(--muted); margin: 0; }

/* hero */
.hero {
  position: relative; overflow: hidden; border-radius: 16px; padding: 28px; background: var(--surface); border: 1px solid var(--line);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 18px 18px;
}
.hero h1 { max-width: 18ch; }
.hero p { max-width: 60ch; color: var(--muted); }
.hero > *:not(.hero-ecg) { position: relative; z-index: 1; }
.hero-ecg { position: absolute; right: -10px; top: 26px; width: 42%; max-width: 460px; height: 70px; opacity: .55; pointer-events: none; z-index: 0; }
@media (max-width: 900px) { .hero-ecg { display: none; } }
.vitals { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; margin-top: 18px; }
.vital { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 0; }
.vital b { display: block; font-family: var(--f-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.vital span { font-size: .78rem; color: var(--muted); }

.module-card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.module-card:hover { border-color: var(--teal); }
.module-card h3 { display: flex; align-items: center; gap: 8px; }
.swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--teal); border-radius: inherit; }

/* ------- teoria */
.toc { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: 0 0 18px; scrollbar-width: thin; }
.toc button { white-space: nowrap; }
.sec { scroll-margin-top: 80px; }
.sec-head { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; margin-bottom: 8px; }
.sec-body { min-width: 0; }
.sec-body > *:first-child { margin-top: 0; }
.done-btn[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.tbl-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; min-width: 520px; }
.tbl.compact { font-size: .86rem; }
.tbl th { text-align: left; background: var(--surface-2); font-family: var(--f-display); font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { font-weight: 600; }
.callout { border-radius: 10px; padding: 12px 14px; margin: 12px 0; border: 1px solid var(--line); background: var(--surface-2); }
.callout-t { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; font-weight: 700; }
.callout.tip { background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 35%, transparent); }
.callout.tip .callout-t { color: var(--teal); }
.callout.warn { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
.callout.warn .callout-t { color: var(--amber); }
.callout.info { background: var(--trace-soft); border-color: color-mix(in srgb, var(--trace) 30%, transparent); }
.callout.info .callout-t { color: var(--trace); }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
.flow span { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: .9rem; }
.flow span + span::before { content: "→"; margin-right: 8px; color: var(--trace); font-weight: 700; }
.flow.small span { font-size: .84rem; }
.steps { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 6px; }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: baseline; }
.steps li::before { content: counter(s, decimal-leading-zero); font-family: var(--f-mono); font-size: .75rem; color: var(--trace); font-weight: 700; flex: none; }
.steps.compact li { margin: 0; }
.mini-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; margin: 10px 0; }
.mini-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.mini-card-h { font-family: var(--f-display); font-weight: 700; margin-bottom: 2px; }
.mini-card-b { font-size: .9rem; color: var(--muted); }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.two-col > * { min-width: 0; }
.formula { font-family: var(--f-mono); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: .92rem; overflow-x: auto; }
.model { position: relative; border: 1.5px dashed var(--teal); border-radius: 10px; padding: 30px 14px 14px; background: var(--surface); font-size: .97rem; }
.model::before { content: "Modelo para descrever em voz alta"; position: absolute; top: 8px; left: 14px; font-family: var(--f-mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
.case-box { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; margin: 10px 0 4px; }
details.reveal { margin-bottom: 14px; }
details.reveal summary { cursor: pointer; font-weight: 700; color: var(--teal); padding: 4px 0; }
.valve-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.valve { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); min-width: 0; }
.valve h4 { margin: 0 0 8px; color: var(--a4); }
.valve dl { margin: 0; display: grid; gap: 4px; font-size: .9rem; }
.valve dt { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.valve dd { margin: 0; }

/* ------- OSCE */
.case-card { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-decoration: none; color: var(--ink); }
.case-card:hover { border-color: var(--trace); }
.case-card .row { gap: 6px; }
.lvl { font-family: var(--f-mono); font-size: .75rem; color: var(--trace); letter-spacing: .1em; }
.door { border: 2px solid var(--ink); border-radius: 12px; padding: 18px; background: var(--surface); position: relative; }
.door .eyebrow { color: var(--trace); }
.door p { font-size: 1.05rem; }
.osce-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .osce-grid { grid-template-columns: minmax(0, 1fr); } }
.timer { font-family: var(--f-mono); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); }
.timer.low { background: var(--bad); color: #fff; }
.qgroup { margin-bottom: 12px; }
.qgroup-h { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 8px 0 6px; }
.qbtn { display: block; width: 100%; text-align: left; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; margin-bottom: 6px; font-size: .92rem; }
.qbtn:hover { border-color: var(--teal); }
.qbtn.asked { background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 40%, transparent); }
.qbtn.asked::before { content: "✓ "; color: var(--teal); font-weight: 700; }
.log { display: flex; flex-direction: column; gap: 8px; max-height: 560px; overflow-y: auto; padding-right: 4px; }
.log-item { border-radius: 10px; padding: 10px 12px; background: var(--surface-2); font-size: .93rem; }
.log-item .who { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.log-item.ex { background: var(--trace-soft); }
.log-item.ex .who { color: var(--trace); }
.log-empty { color: var(--muted); font-size: .92rem; padding: 18px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.tab { padding: 8px 12px; border: 0; background: none; cursor: pointer; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--trace); }
.score-ring { width: 120px; height: 120px; flex: none; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.check:last-child { border-bottom: 0; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--teal); flex: none; }
.mark { font-family: var(--f-mono); font-weight: 700; flex: none; width: 22px; text-align: center; }
.mark.y { color: var(--ok); } .mark.n { color: var(--bad); }
.opt { display: block; width: 100%; text-align: left; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; margin-bottom: 8px; font-size: .97rem; }
.opt:hover:not([disabled]) { border-color: var(--teal); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt[disabled] { cursor: default; }

/* ------- quiz & flash */
.quiz-q { font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; margin-bottom: 14px; }
.explain { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: .95rem; }
.progress-line { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.progress-line i { display: block; height: 100%; background: var(--trace); }
.flash { perspective: 1200px; width: 100%; max-width: 560px; margin: 0 auto; cursor: pointer; }
.flash-inner { position: relative; min-height: 260px; transition: transform .45s ease; transform-style: preserve-3d; }
.flash.flipped .flash-inner { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px; gap: 10px; }
.flash-face.back { transform: rotateY(180deg); background: var(--surface-2); }
.flash-term { font-family: var(--f-display); font-size: 1.7rem; font-weight: 800; }
