<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root { --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#E3ECE9; --surface-3:#D5E2DE; --ink:#12252A; --muted:#566C70; --line:#CBD9D5;
  --teal:#0B6A63; --teal-soft:#D4ECE8; --on-teal:#fff; --trace:#D23D6B; --trace-soft:#FBE3EB; --amber:#A86A0C; --lung:#F6D9E1; --liquid:#5A9BD5;
  --a1:#0B6A63; --a2:#6B4FA0; --a3:#1F6FB0; --a4:#C2335E; --a5:#9A6A12; }
* { box-sizing:border-box; margin:0; }
html, body { width:1280px; height:720px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:Inter, sans-serif; }
body { background-image:linear-gradient(rgba(210,61,107,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(210,61,107,.06) 1px, transparent 1px); background-size:24px 24px; }
.top { position:absolute; left:56px; right:56px; top:30px; display:flex; justify-content:space-between; font-family:"JetBrains Mono", monospace; font-size:15px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
.top b { color:var(--trace); }
.bar { position:absolute; left:56px; right:56px; top:58px; height:4px; background:var(--surface-3); border-radius:4px; }
.bar i { display:block; height:100%; background:var(--teal); border-radius:4px; }
.wrap { position:absolute; left:56px; right:56px; top:96px; bottom:40px; display:flex; gap:40px; }
.text { flex:1; min-width:0; display:flex; flex-direction:column; }
.eyebrow { font-family:"JetBrains Mono", monospace; font-size:17px; letter-spacing:.14em; text-transform:uppercase; color:var(--trace); font-weight:700; }
h1 { font-family:"Inter Display", Inter, sans-serif; font-weight:800; font-size:46px; line-height:1.08; letter-spacing:-.02em; margin:10px 0 26px; }
ul { list-style:none; padding:0; display:flex; flex-direction:column; gap:14px; }
li { font-size:26px; line-height:1.3; padding:12px 18px 12px 22px; border-radius:12px; position:relative; background:transparent; }
li::before { content:""; position:absolute; left:0; top:20px; width:8px; height:8px; border-radius:2px; background:var(--muted); }
li.past { color:#33494E; }
li.cur { background:var(--surface); box-shadow:0 2px 12px rgba(18,37,42,.08); }
li.cur::before { background:var(--trace); }
li.fut { visibility:hidden; }
li b { color:var(--teal); }
.vis { width:500px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; }
.vis svg { width:100%; height:auto; max-height:520px; }
.cover { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 110px; }
.cover .eyebrow { font-size:20px; }
.cover h1 { font-size:86px; margin:16px 0 12px; }
.cover p { font-size:32px; color:var(--muted); max-width:900px; }
.cover svg.ecg { width:620px; height:70px; margin-top:44px; }
.brand { position:absolute; left:110px; bottom:56px; font-family:"Inter Display", Inter; font-weight:800; font-size:24px; }
.brand span { color:var(--trace); }
</style></head><body><div id="root"></div>
<script src="../plataforma/raciocinio.js"></script>
<script src="roteiros-1.js"></script>
<script src="roteiros-2.js"></script>
<script>
function phonoSVG(key) {
  var M = PH[key], W = 480, H = 260, mid = 130, amp = 90, pad = 20, X = function (f) { return pad + f * (W - 2 * pad); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '"><rect width="' + W + '" height="' + H + '" rx="14" fill="#12252A"/>';
  s += '<line x1="' + pad + '" y1="' + mid + '" x2="' + (W - pad) + '" y2="' + mid + '" stroke="#4b6066"/>';
  s += '<text x="' + X(.14) + '" y="26" fill="#93A9AB" font-size="14" font-family="JetBrains Mono">sístole</text><text x="' + X(.5) + '" y="26" fill="#93A9AB" font-size="14" font-family="JetBrains Mono">diástole</text>';
  var seed = 3; function r() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  M.forEach(function (m) {
    if (m[0] === 'spike') { var cx = X(m[1]), h = amp * Math.min(m[2], 1.15), d = '';
      for (var k = 0; k <= 24; k++) { d += (k ? 'L' : 'M') + (cx - 9 + k * .75).toFixed(1) + ' ' + (mid - Math.sin(k * 1.3) * h * Math.exp(-k / 9)).toFixed(1) + ' '; }
      s += '<path d="' + d + '" fill="none" stroke="#F2709A" stroke-width="3"/><text x="' + cx + '" y="' + (H - 14) + '" text-anchor="middle" fill="#E2EDEA" font-size="17" font-weight="700" font-family="JetBrains Mono">' + m[3] + '</text>'; }
    else { var a = X(m[1]), b = X(m[2]), h2 = amp * m[4], N = 40, up = '', dn = '';
      for (var k2 = 0; k2 <= N; k2++) { var f = k2 / N, e = m[3] === 'diamond' ? (f < .45 ? f / .45 : (1 - f) / .55) : m[3] === 'decresc' ? 1 - f : m[3] === 'cresc' ? f : 1;
        up += 'L' + (a + f * (b - a)).toFixed(1) + ' ' + (mid - e * h2 * (.6 + .4 * r())).toFixed(1) + ' ';
        dn = 'L' + (a + f * (b - a)).toFixed(1) + ' ' + (mid + e * h2 * (.6 + .4 * r())).toFixed(1) + ' ' + dn; }
      s += '<path d="M' + a + ' ' + mid + ' ' + up + dn + 'Z" fill="rgba(127,224,210,.55)" stroke="#7FE0D2"/>';
      if (m[5]) s += '<text x="' + ((a + b) / 2) + '" y="' + (mid - h2 - 10) + '" text-anchor="middle" fill="#7FE0D2" font-size="16" font-family="JetBrains Mono">' + m[5] + '</text>'; }
  });
  return s + '</svg>';
}
function visHTML(v) {
  var D = window.SEMIO_DRAW;
  if (v.fn === 'phono') return phonoSVG(v.arg);
  if (v.fn === 'lung') return D.lungSVG(v.arg[0], v.arg[1], false);
  if (v.fn === 'heart') return D.heartSVG(v.arg[0], v.arg[1]);
  if (v.fn === 'abd') return D.abdSVG(v.arg[0], v.arg[1]);
  if (v.fn === 'edema') return D.edemaSVG(D.EDEMAS[v.arg].f);
  return '';
}
var ECG = '<svg class="ecg" viewBox="0 0 620 70"><polyline fill="none" stroke="#D23D6B" stroke-width="4" stroke-linejoin="round" points="0,40 150,40 170,40 182,28 194,40 220,40 232,50 246,6 260,66 272,40 300,40 318,30 338,40 620,40"/></svg>';
window.render = function (ai, si, step) {
  var A = AULAS[ai], S = A.slides[si], root = document.getElementById('root');
  if (S.cover) {
    root.innerHTML = '<div class="cover"><div class="eyebrow">Videoaula ' + A.n + ' de ' + AULAS.length + ' · Semiologia do Adulto I</div><h1>' + S.h + '</h1><p>' + S.sub + '</p>' + ECG + '</div><div class="brand">Estação <span>Semio</span>logia</div>';
    return;
  }
  var total = A.slides.length - 1, prog = si / total * 100;
  root.innerHTML = '<div class="top"><span>Aula ' + A.n + ' · <b>' + A.titulo + '</b></span><span>' + si + ' / ' + total + '</span></div><div class="bar"><i style="width:' + prog + '%"></i></div>' +
    '<div class="wrap"><div class="text"><div class="eyebrow">' + (S.eyebrow || '') + '</div><h1>' + S.h + '</h1><ul>' +
    S.b.map(function (b, k) { return '<li class="' + (k < step ? 'past' : k === step ? 'cur' : 'fut') + '">' + b[0] + '</li>'; }).join('') +
    '</ul></div>' + (S.vis ? '<div class="vis">' + visHTML(S.vis) + '</div>' : '') + '</div>';
};
window.plan = function () { return AULAS.map(function (A) { return { id: A.id, titulo: A.titulo, slides: A.slides.map(function (S) { return S.cover ? [S.say] : S.b.map(function (b) { return b[1]; }); }) }; }); };
</script></body></html>
